site_name: LearnML
site_description: Just enough ML to use and modify models — 12 weeks, phone-first.
# Placeholders: run `python setup_repo.py <github-user> <repo-name>` once to fill these in everywhere.
site_url: https://mjtri.github.io/learnml/
repo_url: https://github.com/mjtri/learnml
edit_uri: ""

# Plain .html pages: keeps iframe paths simple (../visuals/x.html) and correct under the /<repo>/ Pages subpath.
use_directory_urls: false

theme:
  name: material
  font: false            # system fonts: faster first paint on mobile, no Google Fonts request
  palette:
    - scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.footer
    - navigation.top
    - toc.integrate
    - content.code.copy

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      # Tap-to-define glossary: generated by build_glossary.py, appended to every page.
      auto_append:
        - includes/glossary.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/glossary-map.js
  - javascripts/glossary.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# nav:begin
nav:
  - Next up: index.md
  - "Track A · Week 1 · Tensors → gradients":
      - "Lesson 1 · Tensors & shapes": week-01/day-1.md
      - "Lesson 2 · Matmul as mixing": week-01/day-2.md
      - "Lesson 3 · Derivative = sensitivity": week-01/day-3.md
      - "Lesson 4 · Chain rule on a graph": week-01/day-4.md
      - "Lesson 5 · Gradient descent": week-01/day-5.md
      - "Build · Gradients by hand, then by machine": week-01/build.md
  - "Track B · 1 · Budget & mental model":
      - "B1 · Lesson 1 · An agent is a loop; context is the budget": agentic-01/day-1.md
      - "B1 · Lesson 2 · What you actually pay for": agentic-01/day-2.md
      - "B1 · Lesson 3 · Which tool for which job, v1": agentic-01/day-3.md
      - "B1 · Apply · Meters, one instruction file, one measured comparison": agentic-01/apply.md
  - "Track B · Playbook": agentic/playbook.md
  - "Track B · Changelog": agentic/changelog.md
  - Glossary: glossary.md
  - Curriculum: curriculum.md
# nav:end
