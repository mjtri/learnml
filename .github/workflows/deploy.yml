name: deploy

on:
  push:
    branches: [main]
  schedule:
    # 00:05 KST daily, so "Today" and the streak refresh even on days without a push
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Git identity for the gh-pages commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python check_lessons.py
      - run: python build_today.py
      - run: mkdocs gh-deploy --force --strict
